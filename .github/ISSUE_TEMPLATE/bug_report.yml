name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The calling workflow and the steps needed to see the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you're calling, for example v1.1.1.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Workflow and runner
      description: The workflow and runner involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove anything secret first.
      render: text
