version: 2
updates:
  # The templates ship these actions, so a bump is released to the repos that call them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope

  # Only this repo's own tooling; nothing that ships.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
