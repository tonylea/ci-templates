name: Versioning (common)

# Releases when feat, fix or breaking-change commits have landed since the last tag.
# The caller must grant contents: write and call it on pushes to main only.
on:
  workflow_call:
    secrets:
      release-deploy-key:
        description: The repo's release deploy key, the only key allowed to push past main's rules.
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.release-deploy-key }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Bump the version, update the changelog and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            npx commit-and-tag-version --first-release
          elif git log "$(git describe --tags --abbrev=0)..HEAD" --format="%s%n%b" | grep -qE "^(feat|fix)(\(.+\))?!?:|BREAKING CHANGE"; then
            npx commit-and-tag-version
          else
            echo "Nothing to release."
            exit 0
          fi
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push and publish the release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git push --follow-tags origin HEAD:main
          gh release create "$VERSION" --title "$VERSION" --generate-notes
