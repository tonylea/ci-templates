name: Testing

on:
  pull_request:

jobs:
  ansible-molecule:
    uses: ./.github/workflows/testing-ansible-molecule.yml
    with:
      working-directory: tests/ansible-role

  helm-unittest:
    uses: ./.github/workflows/testing-helm-unittest.yml
    with:
      working-directory: tests/helm-chart

  helm-kind:
    uses: ./.github/workflows/testing-helm-kind.yml
    with:
      working-directory: tests/helm-chart

  # The required check. Skipped jobs pass; failed or cancelled ones don't.
  testing:
    needs: [ansible-molecule, helm-unittest, helm-kind]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every testing job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
