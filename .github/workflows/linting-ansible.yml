name: Linting (Ansible)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the Ansible content, its .ansible-lint and requirements-lint.txt.
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements-lint.txt

      - run: pip install -r requirements-lint.txt

      # ansible-core's Galaxy response cache can hand back an entry it never filled (KeyError: 'results').
      - name: Collections
        if: hashFiles(format('{0}/requirements.yml', inputs.working-directory)) != ''
        run: ansible-galaxy collection install --no-cache -r requirements.yml

      - run: ansible-lint
